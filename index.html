<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICK CLAN – ROB RUN</title><style>
*{box-sizing:border-box}body{margin:0;background:#101410;color:#e9eee7;font:16px system-ui}header{padding:20px;border-bottom:1px solid #344132;display:flex;align-items:center;gap:16px}header b{color:#b5e64b;font-size:24px}small{color:#a6b0a2}main{max-width:1100px;margin:auto;padding:20px}button,input,textarea{font:inherit;color:inherit;background:#222b22;border:1px solid #43523d;border-radius:8px;padding:12px}button{cursor:pointer}button:hover{border-color:#b5e64b}button.primary{background:#b5e64b;color:#15200e;font-weight:bold}label{display:grid;gap:6px}form,.panel{background:#1a211a;border:1px solid #344132;border-radius:14px;padding:20px;display:grid;gap:14px}.layout{display:grid;grid-template-columns:230px 1fr;gap:20px}nav details{padding:8px}nav button{width:100%;text-align:left;margin:3px 0}h1,h2{margin:0 0 12px}#status{white-space:pre-wrap;color:#d6dfcc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}[hidden]{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:12px}}
</style><header><svg width="52" height="52" viewBox="0 0 64 64" aria-label="Vorläufiges Clan-Logo"><path d="M32 3 58 15 53 45 32 61 11 45 6 15Z" fill="#202b1d" stroke="#b5e64b" stroke-width="3"/><path d="m43 17-22 0-5 15 22 0-5 15-18 0" fill="none" stroke="#b5e64b" stroke-width="7" stroke-linejoin="bevel"/></svg><div><b>SICK CLAN</b><br><small>ROB RUN MANAGEMENT · V0.1</small></div></header><main><p id="status" role="status"></p><form id="login"><h1>Mitgliederanmeldung</h1><label>Benutzername<input type="text" name="username" required autocomplete="username"></label><label>Passwort<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">Anmelden</button><small>Nur freigeschaltete Mitglieder. Keine öffentliche Registrierung über diese Seite.</small></form><section id="app" hidden class="layout"><nav id="nav"></nav><article><button id="logout">Abmelden</button><h1 id="heading"></h1><section id="content"></section></article></section></main><script type="module">
const url='https://piklnvlswdwxpmnpliwn.supabase.co',key='sb_publishable_8fA_DM-Yw5qWqzXNQn-YLA_MWtxpoS6';
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;let token='',profile=null;
async function api(path,method='GET',body){const res=await fetch(url+path,{method,headers:{apikey:key,Authorization:'Bearer '+(token||key),'Content-Type':'application/json',Prefer:'return=representation'},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.message||data?.msg||'Anfrage fehlgeschlagen');return data}
const groups={'Start':['Dashboard'],'Persönlich':['Mein Profil','Meine Basis','Meine Plantage','Mein Skilltree','Mein Inventar','Meine Wunschliste'],'Clan':['Mitglieder','Gemeinsame Forschung','Clan-Lager','Clan-Finanzen','Aufgabenverwaltung','Schwarzes Brett','Clan-Ziele','Clan-Spezialisierungen','Fuhrparkverwaltung'],'Kommunikation':['Clan-Chat','Private Nachrichten','Benachrichtigungen'],'Handel':['Handelsplatz','Leihsystem','Preisvergleich'],'Aktivitäten':['Überfallplanung','Stadtkarte','Schlüsselübersicht','Timer-Zentrale','Beuterechner'],'Wiki':['Waffen','Munition','Ausrüstung','Gegenstände','Fahrzeuge','Basis & Einrichtung','Produktion','Forschungsdatenbank','Herstellungsrechner'],'Verwaltung':['Accountverwaltung','Rollen & Rechte','Spieldaten bearbeiten','Änderungsverlauf','Systemeinstellungen','Datensicherung','Fehler- und Verbesserungsvorschläge','Update- und Versionsübersicht']};
function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function nav(){const n=$('nav');n.replaceChildren();for(const [g,items] of Object.entries(groups)){if(g==='Verwaltung'&&profile.role!=='Leitung')continue;const d=el('details'),s=el('summary',g);d.open=['Start','Persönlich'].includes(g);d.append(s);for(const item of items){const b=el('button',item);b.onclick=()=>page(item);d.append(b)}n.append(d)}}
function page(name){$('heading').textContent=name;const c=$('content');c.replaceChildren();if(name==='Dashboard'){const p=el('div');p.className='panel';p.append(el('h2','Willkommen, '+profile.name),el('p','Rang: '+profile.role),el('p','Siedlung: '+(profile.settlement||'Noch nicht eingetragen')),el('p','V0.1 – Grundsystem. Weitere Module folgen.'));c.append(p);return}if(['Mein Profil','Meine Basis','Meine Plantage'].includes(name)){const f=el('form');const fields=name==='Mein Profil'?{name:'Spielername',discord:'Discord',specialization:'Spezialisierung',bio:'Beschreibung'}:name==='Meine Basis'?{settlement:'Siedlungsname',settlement_number:'Siedlungsnummer',base_number:'Basisnummer'}:{};for(const [k,v] of Object.entries(fields)){const l=el('label',v),i=el('input');i.name=k;i.value=profile[k]||'';i.maxLength=k==='name'?80:500;i.required=k==='name';l.append(i);f.append(l)}if(name==='Meine Plantage'){const l=el('label','Plantage vorhanden'),i=el('input');i.type='checkbox';i.name='plantation';i.checked=profile.plantation;l.append(i);f.append(l);for(let j=0;j<3;j++){const l=el('label','Pflanzensorte '+(j+1)+' – Name noch nicht verifiziert'),i=el('input');i.type='number';i.min=0;i.max=100000;i.required=true;i.name='plant'+j;i.value=profile.plant_counts[j];l.append(i);f.append(l)}f.append(el('p','Ertragsrechner wartet auf verifizierte Spielwerte.'))}const b=el('button','Speichern');b.className='primary';f.append(b);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{let payload=Object.fromEntries(new FormData(f));if(name==='Meine Plantage')payload={plantation:f.elements.plantation.checked,plant_counts:[0,1,2].map(j=>Number(f.elements['plant'+j].value))};const rows=await api('/rest/v1/profiles?id=eq.'+profile.id,'PATCH',payload);if(!rows?.length)throw Error('Keine Änderung gespeichert');profile=rows[0];status('Gespeichert.')}catch(e){status(e.message)}finally{b.disabled=false}};c.append(f);return}c.append(el('p','Dieses Modul ist geplant, aber noch nicht implementiert.'))}
$('login').onsubmit=async e=>{e.preventDefault();status('');const b=e.target.querySelector('button');b.disabled=true;try{const data=await api('/auth/v1/token?grant_type=password','POST',{email:e.target.elements.username.value.trim().toLowerCase()+'@sick-clan.invalid',password:e.target.elements.password.value});token=data.access_token;const rows=await api('/rest/v1/profiles?select=*');profile=rows.find(r=>r.id===data.user.id);if(!profile)throw Error('Dein Account ist noch nicht freigeschaltet.');$('login').reset();$('login').hidden=true;$('app').hidden=false;nav();page('Dashboard')}catch(e){token='';status(e.message)}finally{b.disabled=false}};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout','POST')}catch{}token='';profile=null;$('app').hidden=true;$('login').hidden=false;$('content').replaceChildren();status('Abgemeldet.')};
</script></html>
